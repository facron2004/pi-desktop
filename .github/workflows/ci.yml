name: CI

# The release workflow only runs when a tag is pushed, so a commit could reach
# main without typecheck or a single test having run. This is the gate for every
# push and pull request; the release job keeps its own copy so a release is never
# cut from an unverified tree even if this workflow is skipped.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 类型检查与单元测试
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 规范检查
        run: npm run lint

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试
        run: npm test

  # The unit suites cannot see the DOM, CSS or geometry rules AGENTS.md leans
  # on; tests/ui-regressions.mjs drives the real renderer with an isolated
  # profile. It found a regression in the image preview and a byte-order mark
  # that only broke the production build, neither of which the unit gate could
  # catch. It runs here rather than in the release job so a failure is a red
  # check on the commit, not a release that cannot be cut.
  ui:
    name: 真实渲染器验收
    runs-on: windows-latest
    timeout-minutes: 45
    needs: verify
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      # Builds out/ itself (electron-vite) and then drives the packaged
      # renderer; PI_DESKTOP_USER_DATA points the run at a throwaway profile.
      - name: 真实渲染器验收
        run: npm run test:ui
