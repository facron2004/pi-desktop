appId: dev.pi.desktop
productName: Pi Desktop
copyright: Copyright © 2026 Pi Desktop contributors

directories:
  buildResources: build
  output: release

files:
  - out/**/*
  - package.json
  - '!**/*.map'
  - '!**/node_modules/*/{test,tests,__tests__,example,examples,docs,doc}/**'

asarUnpack:
  # Pi runs as a plain Node child process, so the modules it resolves at
  # runtime have to exist as real files and not inside the archive.
  - node_modules/@earendil-works/pi-coding-agent/**/*
  - node_modules/jiti/**/*
  - node_modules/quickjs-wasi/**/*

win:
  icon: build/icon-pixel.ico
  target:
    - target: nsis
      arch: [x64, arm64]
    # A folder that is unpacked and zipped: the portable copy. It needs no
    # installation, so it can live on a stick or in a folder that is not the
    # user's profile.
    - target: dir
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  shortcutName: Pi Desktop

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.developer-tools
  darkModeSupport: true

linux:
  target:
    - AppImage
    - deb
  category: Development
