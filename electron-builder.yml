appId: dev.pi.desktop.v3
productName: Pi Desktop
copyright: Copyright © 2026 Pi Desktop contributors

directories:
  buildResources: build
  output: release

# node-pty ships Electron-compatible prebuilds for win32-x64/arm64 (verified
# against Electron 44). Rebuilding them from source needs the VS Spectre
# libraries, which are not part of the default build tools install.
npmRebuild: false

files:
  - out/main/**/*
  - out/preload/**/*
  - out/remote/**/*
  - out/renderer/**/*
  - package.json
  - '!**/*.map'
  - '!**/node_modules/*/{test,tests,__tests__,example,examples,docs,doc}/**'

# The Windows shell reads the taskbar icon itself, so the .ico has to sit
# outside the asar. `win.icon` still embeds it in the executable.
extraResources:
  - from: build/icon-geometric.ico
    to: icon-geometric.ico
  - from: build/icon-geometric.png
    to: icon-geometric.png

asarUnpack:
  # Pi runs as a plain Node child process, so the modules it resolves at
  # runtime have to exist as real files and not inside the archive.
  - node_modules/@earendil-works/pi-coding-agent/**/*
  - node_modules/jiti/**/*
  - node_modules/quickjs-wasi/**/*
  # node-pty loads native .node/.dll/.exe files next to its JavaScript; they
  # cannot be executed from inside the asar archive.
  - node_modules/node-pty/**/*

win:
  icon: build/icon-geometric.ico
  target:
    - target: nsis
      arch: [x64, arm64]
    # A folder that is unpacked and zipped: the portable copy. It needs no
    # installation, so it can live on a stick or in a folder that is not the
    # user's profile.
    - target: dir
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  # Keep the v2-derived installer GUID; appId v3 is only for the refreshed Windows AUMID/icon.
  guid: 8cddbf46-9994-5396-9c61-1e6d6be69598
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  shortcutName: Pi Desktop

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.developer-tools
  darkModeSupport: true

linux:
  target:
    - AppImage
    - deb
  category: Development
